<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFS Student Portal</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Catamaran:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f2f4f2;
            --card: #ffffff;
            --ink: #1a1a1a;
            --ink-2: #4d524d;
            --muted: #8a908a;
            --line: #ebebeb;
            --green: #4caf50;
            --green-dark: #4e7a2e;
            --green-tint: #eaf5e4;
            --red: #e53935;
            --red-tint: #fdecec;
            --amber: #ff9800;
            --amber-ink: #a35f00;
            --amber-tint: #fff4e3;
            --blue: #2196f3;
            --radius: 16px;
            --radius-sm: 14px;
            --serif: 'Amiri', Georgia, serif;
            --sans: 'Catamaran', system-ui, -apple-system, 'Segoe UI', sans-serif;

            /* Stat card tints (after the screenshot's pastel cards) */
            --peach-bg: #fdf0e8; --peach-line: #f2cdb6; --peach-ink: #d9804e;
            --lilac-bg: #f0eefc; --lilac-line: #cfc8f2; --lilac-ink: #6d5fd0;
            --sky-bg:   #ebf3fc; --sky-line:   #b4cdea; --sky-ink:   #2f6db3;
            --leaf-bg:  #edf6e8; --leaf-line:  #bfdcae; --leaf-ink:  #4e7a2e;
        }

        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            line-height: 1.4;
        }
        .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 40px; }
        [hidden] { display: none !important; }
        button { font-family: inherit; cursor: pointer; }

        /* ── Login — logo + layout of the Assessment Portal login (assessment.html); page fonts kept ── */
        body.on-login { background: #1a2a1a; }
        body.on-login::before {
            content: ''; position: fixed; inset: 0;
            background-image: url('hotr-bg.jpg');
            background-size: cover; background-position: center 30%;
            filter: blur(3px) brightness(0.32) saturate(0.6);
            transform: scale(1.05); z-index: 0;
        }
        body.on-login::after {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(ellipse at center, transparent 20%, rgba(5,15,5,0.65) 100%);
            z-index: 0;
        }
        #login {
            position: relative; z-index: 1;
            min-height: calc(100vh - 64px); display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: var(--sans); color: #1A2010;
        }
        .ap-card {
            background: #fff; border-radius: 22px; width: 100%; max-width: 460px; overflow: hidden;
            box-shadow: 0 8px 48px rgba(0,0,0,0.45), 0 2px 12px rgba(0,0,0,0.25);
            animation: ap-rise 0.4s cubic-bezier(.22,.68,0,1.2) both;
        }
        @keyframes ap-rise {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to   { opacity: 1; transform: none; }
        }
        .ap-header { padding: 24px 28px 18px; border-bottom: 1px solid rgba(0,0,0,0.09); }
        .ap-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        .ap-brand svg { flex-shrink: 0; }
        .ap-brand-text { display: flex; flex-direction: column; gap: 2px; }
        .ap-brand-name   { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #26361b; }
        .ap-brand-school { font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: #7ac042; }
        .ap-divider { width: 1px; height: 30px; background: rgba(0,0,0,0.12); flex-shrink: 0; }
        .ap-title { font-size: 22px; font-weight: 800; color: #1A2010; line-height: 1.2; }
        .ap-meta  { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .ap-tag   { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: #F3F5F0; color: #4A5540; }
        .ap-tag.gold { background: rgba(200,150,12,0.12); color: #C8960C; }
        .ap-body { padding: 24px 28px 28px; }
        .ap-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .ap-field label { font-size: 12px; font-weight: 600; color: #4A5540; text-transform: uppercase; letter-spacing: 0.05em; }
        .ap-field .ap-hint { font-size: 11px; color: #8A9A80; margin-top: 3px; }
        .ap-field .ap-err { font-size: 11px; color: #C0392B; }
        .ap-input {
            width: 100%; height: 46px; padding: 0 14px;
            background: #F3F5F0; border: 1.5px solid rgba(0,0,0,0.09); border-radius: 8px;
            font-family: var(--sans); font-size: 18px; font-weight: 600;
            color: #1A2010; letter-spacing: 0.05em; text-transform: uppercase;
            outline: none; transition: border-color 0.15s, box-shadow 0.15s; -webkit-appearance: none;
        }
        .ap-input::placeholder { color: #8A9A80; font-size: 14px; letter-spacing: 0; text-transform: none; }
        .ap-input:focus { border-color: #2D6A2D; background: #fff; box-shadow: 0 0 0 3px rgba(45,106,45,0.12); }
        .ap-input.invalid { border-color: #C0392B; box-shadow: 0 0 0 3px rgba(192,57,43,0.1); }
        .ap-btn {
            width: 100%; height: 50px; border: none; border-radius: 8px;
            background: #2D6A2D; color: #fff;
            font-family: var(--sans); font-size: 16px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: opacity 0.15s, transform 0.1s;
        }
        .ap-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .ap-btn:enabled:hover  { opacity: 0.88; }
        .ap-btn:enabled:active { transform: scale(0.98); }
        .spinner {
            width: 16px; height: 16px; border-radius: 50%;
            border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .ap-status {
            margin-top: 14px; padding: 13px 16px; border-radius: 8px;
            font-size: 13px; font-weight: 500; text-align: center; line-height: 1.5;
            background: #FEF0F0; color: #C0392B;
        }

        /* ── Dashboard header ──────────────────────────────── */
        .head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .avatar {
            flex: 0 0 56px; width: 56px; height: 56px; border-radius: 50%;
            background: var(--green-tint); color: var(--green-dark); border: 2px solid #fff;
            box-shadow: 0 0 0 1.5px #d6e8cc;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 20px; letter-spacing: .5px;
        }
        .who { flex: 1; min-width: 0; }
        .who small { display: block; color: var(--muted); font-size: 15px; font-weight: 500; }
        .who h2 { font-size: 23px; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
        .who .reg { display: block; color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .3px; }
        .badge {
            flex: 0 0 auto; align-self: flex-start; margin-top: 4px;
            padding: 6px 12px; border-radius: 999px; color: #fff;
            font-size: 12px; font-weight: 800; letter-spacing: .6px; white-space: nowrap;
        }
        .badge.ELIGIBLE { background: #4caf50; }
        .badge.ELIGIBLE-W { background: #2196f3; }
        .badge.MAKE-UP { background: #ff9800; }
        .badge.NOT-ELIGIBLE { background: #e53935; }

        .standing {
            display: flex; gap: 10px; align-items: flex-start;
            background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius-sm);
            padding: 12px 14px; margin: 14px 0 22px; font-size: 15px; color: var(--ink-2);
        }
        .standing .dot { flex: 0 0 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
        .standing strong { color: var(--ink); }

        .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 12px; }
        .sec-head h3 { font-size: 20px; font-weight: 800; }
        .sec-head span { font-size: 13px; color: var(--muted); font-weight: 600; }
        section + section { margin-top: 24px; }

        /* ── Overview stat cards ───────────────────────────── */
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat {
            position: relative; overflow: hidden;
            border-radius: var(--radius); border: 1.5px solid; padding: 14px 14px 12px; min-height: 132px;
            display: flex; flex-direction: column;
        }
        .stat::after {           /* soft swirl, after the screenshot's background shapes */
            content: ''; position: absolute; right: -34px; bottom: -40px; width: 110px; height: 110px;
            border-radius: 50%; border: 18px solid currentColor; opacity: .07; pointer-events: none;
        }
        .stat .ico {
            width: 40px; height: 40px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,.7); margin-bottom: auto;
        }
        .stat .ico svg { width: 22px; height: 22px; }
        .stat .lbl { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-top: 12px; }
        .stat .num { font-family: var(--serif); font-size: 34px; font-weight: 700; line-height: 1.05; color: var(--ink); }
        .stat .num small { font-family: var(--sans); font-size: 15px; font-weight: 700; color: var(--muted); margin-left: 2px; }
        .stat .num.text { font-size: 22px; line-height: 1.2; white-space: nowrap; }
        .stat.peach { background: var(--peach-bg); border-color: var(--peach-line); color: var(--peach-ink); }
        .stat.lilac { background: var(--lilac-bg); border-color: var(--lilac-line); color: var(--lilac-ink); }
        .stat.sky   { background: var(--sky-bg);   border-color: var(--sky-line);   color: var(--sky-ink); }
        .stat.leaf  { background: var(--leaf-bg);  border-color: var(--leaf-line);  color: var(--leaf-ink); }

        /* ── Attendance by month ───────────────────────────── */
        .months { background: #eceeec; border: 1.5px solid var(--line); border-radius: var(--radius); padding: 16px 14px 14px; }
        .months-row { display: flex; align-items: flex-start; }
        .month { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
        .month-bar { width: 100%; height: 76px; position: relative; }
        .month-bar i {
            position: absolute; left: 0; right: 0; top: 0; min-height: 10px;
            border-radius: 0 0 16px 16px;
        }
        .month:first-child .month-bar i { border-top-left-radius: 16px; }
        .month:last-child .month-bar i { border-top-right-radius: 16px; }
        .month:only-child .month-bar i { border-radius: 16px; }
        .month .stem { width: 1.5px; height: 14px; background: #c9cdc9; }
        .month .pin { width: 8px; height: 8px; border-radius: 50%; }
        .month b { font-size: 15px; font-weight: 800; margin-top: 6px; }
        .month span { font-size: 12px; color: var(--ink-2); text-align: center; line-height: 1.25; }
        .c0 { background: #dc9a6c; } .c1 { background: #9b8bd6; } .c2 { background: #7fb069; } .c3 { background: #6fa2d8; }
        .month.future .month-bar i { background: #d4d6d4; }
        .month.future .pin { background: #c9cdc9; }

        /* ── Next class ────────────────────────────────────── */
        .next {
            position: relative; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius);
            padding: 14px 16px 16px 22px; overflow: hidden;
        }
        .next::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--green); }
        .next-top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; font-weight: 600; }
        .next-top svg { width: 18px; height: 18px; flex: 0 0 18px; color: var(--green-dark); }
        .next-top .when {
            margin-left: auto; background: var(--green); color: #fff; border-radius: 6px;
            padding: 3px 10px; font-size: 13px; font-weight: 800; white-space: nowrap;
        }
        .next h4 { font-size: 21px; font-weight: 800; margin-top: 8px; line-height: 1.2; }
        .next p { color: var(--ink-2); font-size: 15px; margin-top: 4px; }

        /* ── Lists ─────────────────────────────────────────── */
        .list { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); overflow: hidden; }
        .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 58px; }
        .grp > .row:nth-child(even) { background: #f7f9f7; }
        .grp > .row + .row { border-top: 1px solid #f1f2f1; }
        .row .main { flex: 1; min-width: 0; }
        .row .t { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
        .row .s { font-size: 13px; color: var(--muted); font-weight: 600; }
        .group-label { font-size: 12px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); padding: 10px 16px 6px; background: #fafbfa; border-bottom: 1px solid #f1f2f1; }
        .grp + .group-label { border-top: 1.5px solid var(--line); }
        .mark { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
        .mark .circle { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .mark svg { width: 16px; height: 16px; }
        .mark.yes .circle { background: var(--green-tint); color: #2e7d32; }
        .mark.no .circle { background: var(--red-tint); color: var(--red); }
        .mark.dash .circle { background: #f0f1f0; color: #a0a5a0; }
        .chip { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
        .chip.part { background: var(--amber-tint); color: var(--amber-ink); }
        .chip.soon { background: #f0f1f0; color: #6d736d; }
        .chip.today { background: var(--green-tint); color: var(--green-dark); }
        .empty { padding: 18px 16px; color: var(--muted); font-size: 15px; }

        /* ── Footer actions ────────────────────────────────── */
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 28px; }
        .btn-ghost {
            padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card);
            font-size: 16px; font-weight: 700; color: var(--ink); min-height: 50px;
        }
        .btn-ghost.danger { color: #b3261e; }
        .note { text-align: center; color: var(--muted); font-size: 13px; margin-top: 14px; }
        .note.warn { color: var(--amber-ink); }
    </style>
</head>
<body>
<div class="wrap">

    <!-- ── Login ───────────────────────────────────────────── -->
    <main id="login" hidden>
        <div class="ap-card">
            <div class="ap-header">
                <div class="ap-brand">
                    <svg viewBox="0 0 1535.61 720.7" width="56" height="26" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="House on the Rock">
                <path fill="#7ac042" d="M0,693.1l17.76-27.95,78.77-14.93,39.53-55.38c77.39-18.85,157.19-33.28,236.48-44.4,298.97-41.95,607.51-36.4,904.31,19.14,48.81,9.13,92.27,16.51,137.14,38.78,15.07,7.48,54.7,29.33,64.06,41.87,6.62,8.87,11.26,24.98,17.82,34.63,6.09,3.05,24.83,2.93,29.31,6.17,1.19.86,10.43,20.26,10.44,21.53-8.4,1.77-17.28-.18-25.46-.53-172.91-7.3-345.62-20.92-518.95-15.98-120.92,3.45-242.02,15.47-362.82,21.05-167.22,7.73-335,2.5-501.9-11.03-42.2-3.42-84.32-8.22-126.47-11.98v-1Z"/>
                <path fill="#26361b" d="M905.76,112.87v160.78c24.25-7.17,48.56-17.58,74.47-15.96,28.01,1.75,53.53,16.33,75.81,32.13,50,35.45,119.73,106.25,181.15,113.65,13.1,1.58,26.08-1.17,36.47,9.51,5.34,5.49,12.01,21.51,12.01,28.95v22.47l-64.98,1v45.94c-35.89-4.17-71.67-10.41-107.6-14.86-242.16-30.01-485.68-27.78-727.54,4.01-19.03,2.5-37.9,6.26-57.05,7.91-2.5-13.93-2.65-28.83-1.58-43h-41.99v-31.46c0-3.13,1.55-12.2,2.48-15.5,2.27-8.01,6.95-12.37,15.27-13.7,101.98-.92,204.14,1.97,304.17-19.72,86.33-18.72,163.38-55.83,243.75-90.56.54-17.23-.14-34.53.17-51.77.1-5.48-.09-10.99,0-16.48,15.76-35.82,32.94-71.42,50.13-106.71.93-1.91,1.92-4.24,3-5.99.46-.74,1.51-2.57,1.85-.64Z"/>
                <path fill="#f6eb19" d="M850.78,242.7c-75.13,29.86-146.12,67.66-224.73,88.6-38.12,10.16-77.21,16.63-116.54,20.16l-1.47-1.58c-9.55-57.54-3.35-116.46,19.35-170.07C583.95,46.3,728.79-28.69,870.99,10.3c109.33,29.97,193.87,126.56,210.72,238.39-1.54.38-2.17-.63-3.28-1.2-7.95-4.12-16.61-11.38-25.03-15.94-30.39-16.47-65.95-25.9-100.59-19.82l-47.04-98.85c-.35-1.93-1.4-.09-1.85.64-1.08,1.75-2.07,4.08-3,5.99-17.19,35.29-34.37,70.89-50.13,106.71-.09,5.49.1,11,0,16.48Z"/>
            </svg>
                    <div class="ap-divider"></div>
                    <div class="ap-brand-text">
                        <span class="ap-brand-name">House on the Rock Lagos</span>
                        <span class="ap-brand-school">Rock Foundation School</span>
                    </div>
                </div>
                <h1 class="ap-title">Student Portal</h1>
                <div class="ap-meta">
                    <span class="ap-tag">Finding the Rock</span>
                    <span class="ap-tag gold" id="streamTag" hidden></span>
                </div>
            </div>
            <form class="ap-body" id="loginForm" novalidate>
                <div class="ap-field">
                    <label for="regInput">Registration Number</label>
                    <input class="ap-input" id="regInput" name="reg" type="text" inputmode="text" autocomplete="off"
                           autocapitalize="characters" spellcheck="false" placeholder="RFS / XXXX / XXX" maxlength="14">
                    <span class="ap-hint">Format: RFS/2601/053</span>
                    <span class="ap-err" id="regErr" hidden></span>
                </div>
                <button class="ap-btn" id="signInBtn" type="submit"></button>
                <div class="ap-status" id="loginError" role="alert" hidden></div>
            </form>
        </div>
    </main>

    <!-- ── Dashboard ───────────────────────────────────────── -->
    <main id="dash" hidden>
        <header class="head">
            <div class="avatar" id="avatar" aria-hidden="true"></div>
            <div class="who">
                <small>Welcome back,</small>
                <h2 id="fullName"></h2>
                <span class="reg" id="regLabel"></span>
            </div>
            <span class="badge" id="eligBadge"></span>
        </header>
        <div class="standing" id="standing"><span class="dot" id="standingDot"></span><div id="standingText"></div></div>

        <section>
            <div class="sec-head"><h3>Overview</h3><span id="streamNote"></span></div>
            <div class="stats">
                <div class="stat peach">
                    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18M8.5 15l2.2 2.2L15.5 13"/></svg></div>
                    <div class="lbl">Attendance Points</div>
                    <div class="num" id="statPts">0</div>
                </div>
                <div class="stat lilac">
                    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg></div>
                    <div class="lbl">Expected</div>
                    <div class="num" id="statExp">0</div>
                </div>
                <div class="stat sky">
                    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V14M10 20V9M16 20v-6M22 4l-6 5-4-3-8 6"/></svg></div>
                    <div class="lbl">Attendance %</div>
                    <div class="num" id="statPct">0%</div>
                </div>
                <div class="stat leaf">
                    <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.6c2.6.2 4.4 1.9 5 5.4"/></svg></div>
                    <div class="lbl">Stream</div>
                    <div class="num text" id="statStream"></div>
                </div>
            </div>
        </section>

        <section id="monthsSec">
            <div class="sec-head"><h3>Attendance by Month</h3></div>
            <div class="months"><div class="months-row" id="months"></div></div>
        </section>

        <section id="nextSec">
            <div class="sec-head"><h3>Next Class</h3></div>
            <div class="next">
                <div class="next-top">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                    <span id="nextTime"></span>
                    <span class="when" id="nextWhen"></span>
                </div>
                <h4 id="nextTopic"></h4>
                <p id="nextDate"></p>
            </div>
        </section>

        <section>
            <div class="sec-head"><h3>Class Attendance</h3><span id="classCount"></span></div>
            <div class="list" id="classList"></div>
        </section>

        <section>
            <div class="sec-head"><h3>Test Status</h3><span id="testCount"></span></div>
            <div class="list" id="testList"></div>
        </section>

        <div class="actions">
            <button class="btn-ghost" id="refreshBtn" type="button">Refresh</button>
            <button class="btn-ghost danger" id="logoutBtn" type="button">Log out</button>
        </div>
        <p class="note" id="updatedNote" aria-live="polite"></p>
    </main>
</div>

<script>
// Same deployment as UNIFIED_SCRIPT_URL in admin.html (ftr-unified-script.js). Public action — no token.
const STUDENT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwMmM2fHiOLcRN_63A15K7Qkft3xFd9D9FsLTeBomuoK2Gom3w5S19Se0gW43fCSY4q/exec';
const SESSION_KEY = 'rfsStudentPortal';
const REQUEST_TIMEOUT_MS = 20000;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICONS = {
    yes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    no: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
    dash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M7 12h10"/></svg>'
};
const ELIG_TEXT = {
    'ELIGIBLE': 'Eligible',
    'ELIGIBLE-W': 'Eligible (warning)',
    'MAKE-UP': 'Make-up',
    'NOT ELIGIBLE': 'Not eligible'
};
const ELIG_COLOR = { 'ELIGIBLE': '#4caf50', 'ELIGIBLE-W': '#2196f3', 'MAKE-UP': '#ff9800', 'NOT ELIGIBLE': '#e53935' };

// ── Session (sessionStorage only; every access guarded) ──────
function readSession() {
    try { const v = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); return v && v.reg && v.data ? v : null; }
    catch (e) { return null; }
}
function writeSession(reg, data) {
    try { sessionStorage.setItem(SESSION_KEY, JSON.stringify({ reg: reg, data: data, savedAt: Date.now() })); } catch (e) {}
}
function clearSession() { try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }

// ── Reg number: "rfs 2601 053", "2601/053", "2601053" → "RFS/2601/053" ──
function normaliseReg(raw) {
    const t = String(raw || '').toUpperCase().replace(/\s+/g, '');
    let m = /^(?:RFS)?\/?(\d{4})\/?(\d{3})$/.exec(t);
    return m ? 'RFS/' + m[1] + '/' + m[2] : t;
}

// ── Network ──────────────────────────────────────────────────
async function fetchStatus(reg) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
    try {
        const res = await fetch(STUDENT_SCRIPT_URL + '?action=get_student_status&reg=' + encodeURIComponent(reg), { signal: ctrl.signal });
        const data = await res.json();
        if (!data || data.status !== 'success') return { ok: false, message: (data && data.message) || 'Something went wrong. Please try again.' };
        return { ok: true, data: data };
    } catch (err) {
        return { ok: false, network: true, message: err && err.name === 'AbortError'
            ? 'The server is taking too long. Check your connection and try again.'
            : 'Could not reach the server. Check your connection and try again.' };
    } finally { clearTimeout(timer); }
}

// ── Screens ──────────────────────────────────────────────────
const SIGN_IN_LABEL = '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3H5a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4"/><polyline points="16 3 20 7 12 11"/></svg>View My Status';
function showLogin(message) {
    $('dash').hidden = true;
    $('login').hidden = false;
    document.body.classList.add('on-login');
    const err = $('loginError');
    err.textContent = message || '';
    err.hidden = !message;
    setRegError('');
    setBusy(false);
    loadStreamTag();
}
function setBusy(busy) {
    const b = $('signInBtn');
    b.disabled = busy;
    b.innerHTML = busy ? '<span class="spinner" aria-hidden="true"></span>Checking…' : SIGN_IN_LABEL;
}
function setRegError(message) {
    $('regErr').textContent = message || '';
    $('regErr').hidden = !message;
    $('regInput').classList.toggle('invalid', !!message);
}

// The active stream on the login card ("Stream 3 · 2026"), from the public get_active_stream.
// Best effort: on any failure the tag just stays hidden.
let streamTagLoaded = false;
async function loadStreamTag() {
    if (streamTagLoaded) return;
    streamTagLoaded = true;
    try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
        const res = await fetch(STUDENT_SCRIPT_URL + '?action=get_active_stream', { signal: ctrl.signal });
        clearTimeout(timer);
        const d = await res.json();
        if (!d || d.status !== 'success' || !d.stream) { streamTagLoaded = false; return; }
        const st = /^\d+$/.test(String(d.stream)) ? String(Number(d.stream)) : String(d.stream);
        $('streamTag').textContent = 'Stream ' + st + (d.year ? ' · ' + d.year : '');
        $('streamTag').hidden = false;
    } catch (e) { streamTagLoaded = false; }
}

// Same as the Assessment Portal: letters, digits and "/" only, upper-case
$('regInput').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/[^A-Za-z0-9/]/g, '').toUpperCase();
    setRegError('');
});

$('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const reg = normaliseReg($('regInput').value);
    $('regInput').value = reg;
    $('loginError').hidden = true;
    if (!/^RFS\/\d{4}\/\d{3}$/.test(reg)) { setRegError('Enter your registration number like RFS/2601/053.'); $('regInput').focus(); return; }
    setRegError('');
    setBusy(true);
    const r = await fetchStatus(reg);
    setBusy(false);
    if (!r.ok) { showLogin(r.message); return; }
    writeSession(reg, r.data);
    renderDashboard(r.data, Date.now());
    window.scrollTo(0, 0);
});

$('logoutBtn').addEventListener('click', () => {
    clearSession();
    $('regInput').value = '';
    showLogin('');
    window.scrollTo(0, 0);
});

$('refreshBtn').addEventListener('click', () => refresh(false));

async function refresh(quiet) {
    const s = readSession();
    if (!s) { showLogin(''); return; }
    const btn = $('refreshBtn');
    btn.disabled = true; btn.textContent = 'Refreshing…';
    const r = await fetchStatus(s.reg);
    btn.disabled = false; btn.textContent = 'Refresh';
    if (r.ok) { writeSession(s.reg, r.data); renderDashboard(r.data, Date.now()); return; }
    const note = $('updatedNote');
    note.className = 'note warn';
    note.textContent = (quiet ? 'Showing saved details. ' : '') + r.message;
}

// ── Dates ────────────────────────────────────────────────────
const DAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAY_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MON_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function ymdParts(ymd) { const p = ymd.split('-').map(Number); return { y: p[0], m: p[1] - 1, d: p[2], wd: new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay() }; }
function shortDate(ymd) { const p = ymdParts(ymd); return DAY[p.wd] + ', ' + p.d + ' ' + MON[p.m]; }
function longDate(ymd) { const p = ymdParts(ymd); return DAY_LONG[p.wd] + ', ' + p.d + ' ' + MON_LONG[p.m] + ' ' + p.y; }
function daysBetween(a, b) { const A = ymdParts(a), B = ymdParts(b); return Math.round((Date.UTC(B.y, B.m, B.d) - Date.UTC(A.y, A.m, A.d)) / 864e5); }

// ── Render ───────────────────────────────────────────────────
// A class still to come: a future date, or today's class before the student has checked in.
// (Listed under "Coming up" = any date from today on; counted as held once attended.)
let TODAY = '';
const isAhead = c => c.date > TODAY || (c.date === TODAY && !c.attended);
function renderDashboard(d, savedAt) {
    TODAY = d.today || '';
    $('login').hidden = true;
    $('dash').hidden = false;
    document.body.classList.remove('on-login');

    const first = d.firstName || '', last = d.lastName || '';
    $('avatar').textContent = ((first[0] || '') + (last[0] || '')).toUpperCase() || '?';
    $('fullName').textContent = (first + ' ' + last).trim();
    $('regLabel').textContent = d.reg;
    const badge = $('eligBadge');
    badge.className = 'badge ' + String(d.eligibility).replace(/\s+/g, '-');
    badge.textContent = d.eligibility;
    badge.setAttribute('aria-label', 'Status: ' + (ELIG_TEXT[d.eligibility] || d.eligibility));

    const classes = Array.isArray(d.classes) ? d.classes : [];
    renderStanding(d, classes.filter(isAhead).length);

    $('statPts').textContent = d.attPts;
    $('statExp').textContent = d.expectedAtt;
    $('statPct').innerHTML = esc(d.attPct) + '<small>%</small>';
    $('statStream').textContent = d.className + ' ' + d.year + ' S' + d.stream;
    $('streamNote').textContent = 'Stream ' + d.stream + ' · ' + d.year;

    renderMonths(classes);
    renderNext(d.nextClass, d.today);
    renderClasses(classes);
    renderTests(Array.isArray(d.tests) ? d.tests : []);

    const note = $('updatedNote');
    note.className = 'note';
    const t = new Date(savedAt || Date.now());
    note.textContent = 'Updated ' + t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '. Attendance and tests update as soon as they are recorded.';
}

function renderStanding(d, remaining) {
    const th = d.thresholds || {}, exp = Number(d.expectedAtt) || 0, pts = Number(d.attPts) || 0;
    const need = pct => Math.max(0, Math.ceil((pct / 100) * exp - 1e-9) - pts);
    const left = remaining > 0 ? ' ' + remaining + (remaining === 1 ? ' class is' : ' classes are') + ' still ahead this stream.' : '';
    let html;
    if (d.eligibility === 'ELIGIBLE') html = '<strong>You meet the attendance requirement.</strong> Keep attending to stay eligible.';
    else if (d.eligibility === 'ELIGIBLE-W') html = '<strong>Eligible, with a warning.</strong> ' + need(th.eligible) + ' more point' + (need(th.eligible) === 1 ? '' : 's') + ' to reach ELIGIBLE (' + th.eligible + '%).' + left;
    else if (d.eligibility === 'MAKE-UP') html = '<strong>You will need make-up classes.</strong> ' + need(th.eligibleW) + ' more point' + (need(th.eligibleW) === 1 ? '' : 's') + ' to reach ELIGIBLE-W (' + th.eligibleW + '%).' + left;
    else html = '<strong>Not eligible yet.</strong> ' + need(th.makeUp) + ' more point' + (need(th.makeUp) === 1 ? '' : 's') + ' to reach MAKE-UP (' + th.makeUp + '%). Speak to your group admin.' + left;
    $('standingText').innerHTML = html;
    $('standingDot').style.background = ELIG_COLOR[d.eligibility] || '#8a908a';
}

function renderMonths(classes) {
    const byMonth = {};
    classes.forEach(c => {
        const k = c.date.slice(0, 7);
        const m = byMonth[k] || (byMonth[k] = { held: 0, attended: 0, ahead: 0 });
        if (isAhead(c)) m.ahead++;
        else { m.held++; if (c.attended) m.attended++; }
    });
    const keys = Object.keys(byMonth).sort();
    $('monthsSec').hidden = keys.length === 0;
    $('months').innerHTML = keys.map((k, i) => {
        const m = byMonth[k], p = ymdParts(k + '-01');
        const future = m.held === 0;
        const h = future ? 34 : Math.max(14, Math.round((m.attended / m.held) * 100));
        const sub = future ? m.ahead + ' ahead' : m.attended + ' of ' + m.held + ' classes';
        return '<div class="month' + (future ? ' future' : '') + '">' +
            '<div class="month-bar"><i class="c' + (i % 4) + '" style="height:' + h + '%"></i></div>' +
            '<div class="stem"></div><div class="pin c' + (i % 4) + '"></div>' +
            '<b>' + MON[p.m] + '</b><span>' + esc(sub) + '</span></div>';
    }).join('');
}

function renderNext(n, today) {
    $('nextSec').hidden = !n;
    if (!n) return;
    const gap = today ? daysBetween(today, n.date) : null;
    $('nextWhen').textContent = gap === 0 ? 'Today' : gap === 1 ? 'Tomorrow' : shortDate(n.date);
    $('nextTime').textContent = n.start ? n.start + (n.end ? ' – ' + n.end : '') : 'Time to be confirmed';
    $('nextTopic').textContent = n.topic || 'Class';
    const wd = ymdParts(n.date).wd;
    $('nextDate').textContent = longDate(n.date) + (wd === 6 ? ' · Saturday class' : wd === 0 ? ' · Sunday class' : '');
}

function classRow(c) {
    const label = c.eventType === 'SAT' ? 'Saturday' : 'Sunday';
    let right;
    if (c.state === 'ATTENDED') right = '<span class="mark yes" title="Attended"><span class="circle">' + ICONS.yes + '</span></span>';
    else if (c.state === 'PARTIAL' && c.date === TODAY && c.checkedIn) right = '<span class="chip today">Checked in</span>';
    else if (c.state === 'PARTIAL') right = '<span class="chip part">' + (c.checkedIn ? 'In only' : 'Out only') + '</span>';
    else if (c.state === 'ABSENT') right = '<span class="mark no" title="Absent"><span class="circle">' + ICONS.no + '</span></span>';
    else if (c.state === 'TODAY') right = '<span class="chip today">Today</span>';
    else right = '<span class="chip soon">Upcoming</span>';
    const aria = { ATTENDED: 'attended', PARTIAL: c.date === TODAY && c.checkedIn ? 'checked in' : c.checkedIn ? 'checked in only' : 'checked out only', ABSENT: 'absent', TODAY: 'today', UPCOMING: 'upcoming' }[c.state] || '';
    return '<div class="row" aria-label="' + esc(shortDate(c.date) + ', ' + label + ', ' + aria) + '">' +
        '<div class="main"><div class="t">' + esc(shortDate(c.date)) + '</div><div class="s">' + label + '</div></div>' + right + '</div>';
}

function renderClasses(classes) {
    const ahead = classes.filter(c => c.date >= TODAY).sort((a, b) => a.date < b.date ? -1 : 1);
    const past = classes.filter(c => c.date < TODAY).sort((a, b) => a.date < b.date ? 1 : -1);
    const held = classes.filter(c => !isAhead(c));
    $('classCount').textContent = held.length ? held.filter(c => c.attended).length + ' of ' + held.length + ' attended' : '';
    if (!classes.length) { $('classList').innerHTML = '<div class="empty">No classes recorded yet.</div>'; return; }
    let html = '';
    if (ahead.length) html += '<div class="group-label">Coming up</div><div class="grp">' + ahead.map(classRow).join('') + '</div>';
    if (past.length) html += (ahead.length ? '<div class="group-label">Past classes</div>' : '') + '<div class="grp">' + past.map(classRow).join('') + '</div>';
    $('classList').innerHTML = html;
}

function renderTests(tests) {
    const taken = tests.filter(t => t.taken).length;
    $('testCount').textContent = tests.length ? taken + ' of ' + tests.length + ' taken' : '';
    $('testList').innerHTML = tests.length ? '<div class="grp">' + tests.map(t =>
        '<div class="row" aria-label="' + esc(t.topic + ', ' + (t.taken ? 'taken' : 'not taken yet')) + '">' +
        '<div class="main"><div class="t">' + esc(t.topic) + '</div><div class="s">' + (t.taken ? 'Taken' : 'Not taken yet') + '</div></div>' +
        '<span class="mark ' + (t.taken ? 'yes' : 'dash') + '"><span class="circle">' + (t.taken ? ICONS.yes : ICONS.dash) + '</span></span></div>'
    ).join('') + '</div>' : '<div class="empty">No tests set yet.</div>';
}

// ── Start: a saved session skips the login, then refreshes quietly ──
(function start() {
    const s = readSession();
    if (s) { renderDashboard(s.data, s.savedAt); refresh(true); }
    else showLogin('');
})();
</script>
</body>
</html>
